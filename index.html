<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pense-bête</title>
<style>
  :root{
    --papier:#E6E8E4;
    --encre:#1C2622;
    --encre-pale:#5C6A64;
    --trait:#C3C9C2;
    --olive:#5F7042;
    --prune:#733246;
    --blanc:#F4F5F2;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;
    background:var(--papier);
    color:var(--encre);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .page{max-width:520px;margin:0 auto;padding:28px 20px 64px}
  h1{
    font:400 30px/1.1 "Iowan Old Style",Palatino,Georgia,serif;
    margin:0 0 2px;letter-spacing:-.01em;
  }
  .sous{color:var(--encre-pale);font-size:14px;margin:0 0 26px}

  form{display:flex;gap:8px;margin-bottom:10px}
  input[type=text]{
    flex:1;min-width:0;padding:12px 14px;border:1px solid var(--trait);
    border-radius:10px;background:var(--blanc);color:var(--encre);font-size:16px;
  }
  input:focus,button:focus-visible{outline:2px solid var(--olive);outline-offset:1px}
  .qui{display:flex;gap:8px;margin-bottom:26px}
  .qui button{
    flex:1;padding:9px;border:1px solid var(--trait);background:transparent;
    border-radius:10px;font-size:14px;color:var(--encre-pale);cursor:pointer;
  }
  .qui button[aria-pressed=true]{background:var(--encre);border-color:var(--encre);color:var(--blanc)}
  .ajout{
    padding:12px 16px;border:none;border-radius:10px;background:var(--encre);
    color:var(--blanc);font-size:16px;cursor:pointer;
  }

  ul{list-style:none;margin:0;padding:0}
  li{
    display:flex;align-items:flex-start;gap:12px;
    padding:16px 0;border-top:1px solid var(--trait);
  }
  li:last-child{border-bottom:1px solid var(--trait)}
  .coche{
    flex:0 0 auto;width:22px;height:22px;margin-top:2px;border-radius:50%;
    border:1.5px solid var(--trait);background:transparent;cursor:pointer;
  }
  .corps{flex:1;min-width:0}
  .titre{display:block;word-break:break-word}
  .tag{font-size:12.5px;color:var(--encre-pale);margin-top:3px;display:block}
  .tag::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
  .tag.papa::before{background:var(--olive)}
  .tag.maman::before{background:var(--prune)}
  .relance{
    flex:0 0 auto;padding:8px 13px;border:1px solid var(--encre);background:transparent;
    border-radius:999px;font-size:13.5px;color:var(--encre);cursor:pointer;text-decoration:none;
  }
  .relance:active{background:var(--encre);color:var(--blanc)}

  .vide{color:var(--encre-pale);font-size:15px;padding:22px 0;border-top:1px solid var(--trait)}

  details{margin-top:38px;border-top:1px solid var(--trait);padding-top:16px}
  summary{cursor:pointer;color:var(--encre-pale);font-size:14px}
  .champ{margin-top:16px}
  .champ label{display:block;font-size:13.5px;color:var(--encre-pale);margin-bottom:5px}
  .champ input{width:100%}
  .aide{font-size:13px;color:var(--encre-pale);margin-top:14px}
  .etat{font-size:13px;color:var(--olive);min-height:18px;margin-top:10px}
</style>
</head>
<body>
<div class="page">
  <h1>Pense-bête</h1>
  <p class="sous">Une tâche, une personne, un rappel envoyé sur WhatsApp.</p>

  <form id="form">
    <input type="text" id="intitule" placeholder="Acheter du sucre" autocomplete="off">
    <button type="submit" class="ajout">Ajouter</button>
  </form>
  <div class="qui" id="qui"></div>

  <ul id="liste"></ul>
  <p class="vide" id="vide" hidden>Rien en attente. La liste se remplit avec le bouton Ajouter.</p>

  <details id="reglages">
    <summary>Réglages</summary>
    <div class="champ"><label for="n1">Nom</label><input type="text" id="n1"></div>
    <div class="champ"><label for="t1">Numéro WhatsApp</label><input type="text" id="t1" inputmode="tel" placeholder="06 12 34 56 78"></div>
    <div class="champ"><label for="n2">Nom</label><input type="text" id="n2"></div>
    <div class="champ"><label for="t2">Numéro WhatsApp</label><input type="text" id="t2" inputmode="tel" placeholder="06 98 76 54 32"></div>
    <p class="etat" id="etat"></p>
    <p class="aide">Les numéros français saisis en 06 ou 07 sont convertis au format international. Pour un autre pays, écrivez le numéro avec son indicatif.</p>
  </details>
</div>

<script>
const CLE = "pensebete:v1";
let etat = {
  gens: [
    {id:"a", nom:"Papa",  tel:""},
    {id:"b", nom:"Maman", tel:""}
  ],
  taches: [],
  choix: "a"
};

function charger(){
  try{
    const brut = localStorage.getItem(CLE);
    if(brut) etat = Object.assign(etat, JSON.parse(brut));
  }catch(e){ /* première ouverture, ou stockage local indisponible dans ce navigateur */ }
}
function sauver(){
  try{ localStorage.setItem(CLE, JSON.stringify(etat)); }
  catch(e){ document.getElementById("etat").textContent = "Enregistrement impossible dans ce navigateur."; }
}

function normaliser(tel){
  let t = (tel||"").replace(/[^\d+]/g,"");
  if(t.startsWith("+")) return t.slice(1);
  if(t.startsWith("00")) return t.slice(2);
  if(t.startsWith("0"))  return "33" + t.slice(1);
  return t;
}
function personne(id){ return etat.gens.find(g => g.id === id) || etat.gens[0]; }

function dessiner(){
  const qui = document.getElementById("qui");
  qui.innerHTML = "";
  etat.gens.forEach(g => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = "Pour " + g.nom;
    b.setAttribute("aria-pressed", etat.choix === g.id);
    b.onclick = () => { etat.choix = g.id; dessiner(); };
    qui.appendChild(b);
  });

  const ul = document.getElementById("liste");
  ul.innerHTML = "";
  const ouvertes = etat.taches.filter(t => !t.fait);
  document.getElementById("vide").hidden = ouvertes.length > 0;

  ouvertes.forEach(t => {
    const g = personne(t.qui);
    const li = document.createElement("li");

    const c = document.createElement("button");
    c.className = "coche"; c.type = "button";
    c.setAttribute("aria-label", "Marquer « " + t.titre + " » comme faite");
    c.onclick = () => { t.fait = true; sauver(); dessiner(); };

    const corps = document.createElement("div");
    corps.className = "corps";
    const ti = document.createElement("span");
    ti.className = "titre"; ti.textContent = t.titre;
    const tag = document.createElement("span");
    tag.className = "tag " + (g.id === "a" ? "papa" : "maman");
    tag.textContent = g.nom + (g.tel ? "" : " — numéro à renseigner");
    corps.append(ti, tag);

    const a = document.createElement("a");
    a.className = "relance"; a.textContent = "Relancer";
    if(g.tel){
      a.href = "https://wa.me/" + normaliser(g.tel) +
               "?text=" + encodeURIComponent("Pour mémoire : " + t.titre);
      a.target = "_blank"; a.rel = "noopener";
    }else{
      a.href = "#";
      a.onclick = e => { e.preventDefault(); document.getElementById("reglages").open = true;
                         document.getElementById("reglages").scrollIntoView({behavior:"smooth"}); };
    }

    li.append(c, corps, a);
    ul.appendChild(li);
  });
}

document.getElementById("form").onsubmit = e => {
  e.preventDefault();
  const champ = document.getElementById("intitule");
  const v = champ.value.trim();
  if(!v) return;
  etat.taches.push({id:Date.now(), titre:v, qui:etat.choix, fait:false});
  champ.value = "";
  sauver(); dessiner();
};

[["n1","gens",0,"nom"],["t1","gens",0,"tel"],["n2","gens",1,"nom"],["t2","gens",1,"tel"]]
.forEach(([id,_,i,cle]) => {
  const el = document.getElementById(id);
  el.addEventListener("focus", () => { el.value = etat.gens[i][cle]; });
  el.addEventListener("input", () => {
    etat.gens[i][cle] = el.value.trim();
    document.getElementById("etat").textContent = "Enregistré.";
    sauver(); dessiner();
  });
});

charger();
document.getElementById("n1").value = etat.gens[0].nom;
document.getElementById("t1").value = etat.gens[0].tel;
document.getElementById("n2").value = etat.gens[1].nom;
document.getElementById("t2").value = etat.gens[1].tel;
dessiner();
</script>
</body>
</html>
